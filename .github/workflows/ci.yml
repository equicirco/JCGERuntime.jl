name: JCGERuntime CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Test package
        env:
          JCGE_TEST_DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          julia --project=. -e 'using Pkg; if ENV["JCGE_TEST_DEPENDENCIES"] == "latest"; Pkg.update(); else; Pkg.instantiate(); end; Pkg.test()'
